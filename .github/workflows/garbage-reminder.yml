name: Garbage day reminder

on:
  schedule:
    # 23:00 UTC is ~7pm EDT / 6pm EST. GitHub doesn't guarantee scheduled
    # workflows fire at the exact minute - delays of several hours happen,
    # especially under load - so this picks an early-evening UTC time with
    # a wide buffer before NY midnight, keeping "tomorrow" correct even if
    # the actual run lands hours late.
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the message instead of sending it"
        type: boolean
        default: false
      date_override:
        description: "Override 'today' as YYYY-MM-DD (for testing a specific date)"
        type: string
        default: ""

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Send reminder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FAKE_TODAY: ${{ github.event.inputs.date_override }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            node scripts/send-garbage-reminder.mjs --dry-run
          else
            node scripts/send-garbage-reminder.mjs
          fi

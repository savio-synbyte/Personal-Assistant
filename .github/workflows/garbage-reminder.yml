name: Garbage day reminder

on:
  # No `schedule:` trigger here on purpose: GitHub's own cron proved
  # unreliable for this repo (observed delays of 4+ hours, sometimes not
  # firing within a day at all). Instead, an external cron service (see
  # README) calls this workflow's `workflow_dispatch` REST endpoint daily -
  # that path has been fast and reliable every time it's been tested.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the message instead of sending it"
        type: boolean
        default: false
      date_override:
        description: "Override 'today' as YYYY-MM-DD (for testing a specific date)"
        type: string
        default: ""

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Send reminder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FAKE_TODAY: ${{ github.event.inputs.date_override }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            node scripts/send-garbage-reminder.mjs --dry-run
          else
            node scripts/send-garbage-reminder.mjs
          fi
